name: Simple CI Demo

on:
  push: 
    branches: 
        - main
        - master
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - development
          - production
        required: true
        default: development
        description: Choose environment that you going to deploy to

jobs:
  os-printer-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - name: printing os
        run: | 
            echo Hello world
            echo hi from yd7
            echo "i'm working on ${{ runner.os }}"
            exit 0
      - name: not going to run
        run: echo "isn't gonna work"

  print-environment:
    runs-on: ubuntu-22.04

    steps:
        - name: print dispatch env
          run: "echo Current Environment: ${{ inputs.environment}}"
