name: Simple CI Demo

on:
  workflow_dispatch:
    inputs:
      input:
        type: string
        required: true


jobs: 
    job-without-environment:
        runs-on: ubuntu-22.04

        steps:
          - name: Print Secret
            run: echo "print secret var ${{secrets.DATABASE_URL}}"

          - name: Print Client
            run: echo "print secret var ${{vars.APP_URL}}"


    job-with-environment:
        runs-on: ubuntu-22.04

        steps:
          - name: Print Secret
                          
            run: echo "print secret var ${{secrets.GOOGLE_CLIENT_ID}}"

          - name: Print Client
            run: echo "print secret var ${{vars.APP_URL}}"

    job-uses-reusable-workflow: 
       
       uses: "yousefdawood7/github-actions-demo/.github/workflows/reusable-workflow.yaml@main"
       with:
         body: ${{ inputs.input }}
       