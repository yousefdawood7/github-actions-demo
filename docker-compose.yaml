services:
  app:
    image: yousefdawood7/express-app
    container_name: express-app
    environment:
      - PORT
      - DB_NAME=mongodb-container
    ports:
      - 3000:${PORT}

    build: .

    networks:
      - express-network
    volumes:
      - express-volume:/app/src/logs
    depends_on:
      - database

  database:
    image: mongodb/mongodb-community-server
    container_name: mongodb-container

    ports:
      - 3001:27017
    networks:
      - express-network
    volumes:
      - app-volume:/data/db


networks:
  express-network:

volumes:
  express-volume:
  app-volume:

